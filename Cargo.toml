[package]
name = "spiri72"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
description = "A local language model as the will of the 72 spirits, bound by Annulus"
license = "Unlicense"
publish = false

[lib]
name = "spiri72"
path = "src/lib.rs"

[[bin]]
name = "spiri72"
path = "src/main.rs"

[dependencies]
annulus = { git = "https://github.com/KeychainofSolomon/Annulus", rev = "fa15253b34c3648444f0a4d557029271a4d83907" }
hayro = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
