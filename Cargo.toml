[package]
name = "spiri72"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
description = "A local language model as the will of the 72 spirits, bound by Annulus"
license = "Unlicense"
publish = false

[lib]
name = "spiri72"
path = "src/lib.rs"

[[bin]]
name = "spiri72"
path = "src/main.rs"

[dependencies]
annulus = { git = "https://github.com/KeychainofSolomon/Annulus", rev = "c57e0ef1cb6ce5cd0e5b316c9782d877f44f848f" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
